</head>

    <a class="navbar-brand" href="#">Victor Chidubem</a>

      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="offcanvas offcanvas-end" tabindex="-1"  style="width: 150px;" id="navbarTogglerDemo02" aria-labelledby="navbarTogglerDemo02Label">

          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{{ url_for('home') }}">Home</a>
          </li>

          <a class="nav-link" href="{{ url_for('about') }}">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('contact') }}" tabindex="-1">Contact</a>

        </li>
      </ul>

  </div>
